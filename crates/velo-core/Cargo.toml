[package]
name = "velo-core"
description = "Embeddable core of Velo: repository, content-addressed object store, history, merge and sync. No terminal output."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["version-control", "vcs", "snapshot", "history", "embeddable"]
categories = ["development-tools", "filesystem"]

# docs.rs builds with no features by default, which would hide `bundle` and
# `ssh` — the two an embedder is most likely to be looking for.
[package.metadata.docs.rs]
all-features = true

[features]
# Nothing on by default: an embedder should not pay for the CLI's dependencies.
default = []
# Offline history transfer (`bundle create` / `bundle apply`).
bundle = []
# Sync over a spawned server process (ssh:// and child:).
ssh = []
# Sync over HTTP(S) (http:// and https:// URLs) with a blocking client.
http = ["dep:ureq"]
# Key-aware merge drivers, forwarded from velo-merge.
json = ["velo-merge/json"]
yaml = ["velo-merge/yaml"]
toml = ["velo-merge/toml"]

[dependencies]
velo-merge.workspace = true

blake3.workspace = true
fastcdc.workspace = true
chrono.workspace = true
globset.workspace = true
ignore.workspace = true
parking_lot.workspace = true
rayon.workspace = true
regex.workspace = true
rusqlite.workspace = true
similar.workspace = true
ureq = { workspace = true, optional = true }
zstd.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

# File locking and mmap have no wasm equivalent; `RepoLock` is a no-op there and
# storage falls back to `fs::read`.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
fs2.workspace = true
memmap2.workspace = true

# `Utc::now()` needs the JS clock on wasm32-unknown-unknown.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
