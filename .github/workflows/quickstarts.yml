# The quickstarts, run from built packages.
#
# Each page in docs/quickstart/ marks its runnable blocks. This workflow builds
# the wheel and the Node tarball with the reusable Packages workflow, builds
# velody-mcp, and runs every marked block through docs/quickstart/run.py in an
# empty directory: the wheel in a fresh venv, the tarball with `npm install`,
# the Rust page against this checkout's crates. A quickstart that rots fails
# the build.
name: Quickstarts

on:
  push:
    branches: [main]
    paths:
      - "docs/quickstart/**"
      - "bench/coldstart/**"
      - "bindings/**"
      - "crates/**"
      - ".github/workflows/quickstarts.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/quickstart/**"
      - "bench/coldstart/**"
      - "bindings/**"
      - "crates/**"
      - ".github/workflows/quickstarts.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also run velody-mcp and the pages from this published release's assets, for example v6.2.0"
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    uses: ./.github/workflows/packages.yml

  quickstarts:
    name: Run the quickstart pages
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The cold-start kit's own tests
        run: python -m unittest discover -s bench/coldstart -p 'test_*.py'
      - name: The extractor catches a broken block
        run: python docs/quickstart/run.py --self-test
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: artifacts
          merge-multiple: true
      - name: Build velody-mcp
        run: cargo build --locked -p velody-mcp
      - name: Run every page
        run: |
          set -euo pipefail
          ls artifacts
          # The linux wheel and tarball: the other platforms' files are in the
          # same directory and would not install here.
          wheel=$(ls artifacts/*manylinux*x86_64*.whl | head -n 1)
          tgz=$(ls artifacts/velody-core-*-linux.tgz | head -n 1)
          python docs/quickstart/run.py \
            --wheel "$wheel" \
            --tgz "$tgz" \
            --velody-mcp target/debug/velody-mcp

  # The same pages and MCP checks, from a published release's archives instead
  # of CI builds. Runs only when a tag is given at dispatch.
  release-assets:
    name: From the release assets
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    uses: ./.github/workflows/release-smoke.yml
    with:
      source: release
      tag: ${{ inputs.release_tag }}
    permissions:
      contents: read
