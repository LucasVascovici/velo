name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Tests (blocking) ───────────────────────────────────────────────────────
  test:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        # `--workspace` is not optional: `default-members` is velo-cli, so a bare
        # `cargo test` runs only that crate's 19 integration tests and silently
        # skips velo-core's ~300 unit tests.
        run: cargo test --workspace --locked

  # ── Clippy (blocking) ──────────────────────────────────────────────────────
  # Clippy catches real defects (this project has had genuine bugs surfaced by
  # it), so a new warning must fail the build.  Keep it green locally with:
  #   cargo clippy --all-targets --all-features -- -D warnings
  # It is deliberately a separate job from formatting: when the two shared one
  # job, a formatting nit turned the whole thing red and hid clippy's signal.
  # Linted on every OS on purpose: this codebase has `#[cfg(unix)]` /
  # `#[cfg(not(unix))]` branches (file modes, symlinks), so a single-platform
  # run only ever checks half of them.  A Linux-only job missed an `unused_mut`
  # that existed solely because the mutation lived in the non-Unix branch.
  clippy:
    name: Clippy · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-clippy-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-cargo-

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Formatting (advisory) ──────────────────────────────────────────────────
  # Style only — never blocks a legitimate fix from landing.  Fix with:
  #   cargo fmt --all
  fmt:
    name: Format
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check