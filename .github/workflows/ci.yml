name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Tests (blocking) ───────────────────────────────────────────────────────
  test:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        # `--workspace` is not optional: `default-members` is velo-cli, so a bare
        # `cargo test` runs only that crate's 19 integration tests and silently
        # skips velo-core's ~300 unit tests.
        run: cargo test --workspace --locked

      - name: Stage timer tests
        run: cargo test -p velo-core --features timing --locked timing_laps

  # ── Clippy (blocking) ──────────────────────────────────────────────────────
  # Clippy catches real defects (this project has had genuine bugs surfaced by
  # it), so a new warning must fail the build.  Keep it green locally with:
  #   cargo clippy --all-targets --all-features -- -D warnings
  # It is deliberately a separate job from formatting: when the two shared one
  # job, a formatting nit turned the whole thing red and hid clippy's signal.
  # Linted on every OS on purpose: this codebase has `#[cfg(unix)]` /
  # `#[cfg(not(unix))]` branches (file modes, symlinks), so a single-platform
  # run only ever checks half of them.  A Linux-only job missed an `unused_mut`
  # that existed solely because the mutation lived in the non-Unix branch.
  clippy:
    name: Clippy · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-clippy-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-cargo-

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── MSRV (blocking) ────────────────────────────────────────────────────────
  # `rust-version` in Cargo.toml is a promise, and a promise nothing checks is a
  # guess.  This builds on exactly that toolchain so the number stays true — it
  # was derived from the highest MSRV in the dependency tree, and a dependency
  # bump can raise that without anyone noticing.
  #
  # Build, not test: dev-dependencies are allowed to want a newer compiler than
  # the published crates do, and holding the test tooling to the library's floor
  # would be a stricter promise than the manifests make.
  msrv:
    name: MSRV · 1.88
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.88)
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-cargo-

      - name: Build every published crate
        run: cargo build --workspace --locked --all-features

  # ── Packaging (blocking) ───────────────────────────────────────────────────
  # Everything `cargo publish` does except the upload.  Publishing is the one
  # release step that cannot be undone — a version on crates.io is permanent —
  # so the checks that would reject it belong on every push rather than on the
  # day someone runs the command.
  #
  # `--workspace` rather than a crate at a time: velo-core depends on velo-merge
  # by path, and packaging it alone sends cargo to the registry for a version
  # that is not there yet.  Packaging the workspace resolves the siblings
  # against each other, which is also the order a release goes out in.
  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: package-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: package-cargo-

      - name: Package every published crate
        run: cargo package --workspace --locked --exclude prompt-registry --exclude velo-ffi --exclude velo-mcp

  # ── Formatting (advisory) ──────────────────────────────────────────────────
  # Style only — never blocks a legitimate fix from landing.  Fix with:
  #   cargo fmt --all
  fmt:
    name: Format
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Binding parity (blocking) ──────────────────────────────────────────────
  # Every public velo-core entry point is bound or exempted with a reason.
  parity:
    name: Binding parity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check binding parity
        run: python bindings/parity/check.py

  # ── Semver compatibility (blocking) ────────────────────────────────────────
  # A breaking change to velo-core or velo-merge cannot land in a minor
  # release by accident. The baseline is the previous released tag and MUST be
  # bumped to the newest released tag at each release: otherwise the check
  # compares against an ever-older API and stops catching breaks introduced
  # since that tag.
  semver:
    name: Semver check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags must be present for baseline-rev

      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: velo-core,velo-merge
          # Moves to v5.3.0 once the owner tags it; v5.3.0 is not tagged yet.
          baseline-rev: v5.2.0
          feature-group: all-features

  # Licences, bans, sources and advisories against deny.toml for the root
  # workspace. The bindings are separate workspaces whose manifests declare no
  # licence yet, so they are not covered here.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # RustSec advisories against Cargo.lock.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Performance guard: workload ratios against a same-runner calibration,
  # compared with the committed baselines in bench/perf/baseline.json.
  perf:
    name: Perf · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows is advisory until its baseline is calibrated on the runner: the
    # full workload takes over 30 minutes there and measured 6x the local baseline.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Performance guard
        shell: bash
        env:
          VELO_PERF_AGENT_STEPS: ${{ matrix.os == 'windows-latest' && '100' || '' }}
        run: |
          set -o pipefail
          cargo test -p velo-core --release --locked perf_guard -- --ignored --nocapture --test-threads=1 2>&1 | tee perf.log

      - name: Extract measurements
        if: always()
        shell: bash
        run: sed -n 's/^.*PERF_JSON //p' perf.log > perf-${{ runner.os }}.json

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ runner.os }}
          path: perf-${{ runner.os }}.json
          if-no-files-found: warn

  # Crash injection: kill save, restore, switch, undo and redo at every named
  # durable step and check what is left (crates/velo-core/tests/crash.rs).
  crash:
    name: Crash · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Crash tests
        run: cargo test -p velo-core --features failpoints --test crash --locked

  # Golden corpus: every repository and bundle written by a released build
  # opens, migrates or is refused as recorded (crates/velo-core/tests/corpus.rs).
  corpus:
    name: Corpus · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Corpus tests
        run: cargo test -p velo-core --test corpus --locked

      # The real writer replays the spec-written v4 fixture; the keyframe
      # interval setter it needs is behind the failpoints feature.
      - name: Corpus tests (real writer against the spec-written fixture)
        run: cargo test -p velo-core --features failpoints --test corpus --locked

  # An old release refuses a v4 repository, and the bundle way back works
  # (tests/corpus/old_release_check.py).
  old-release:
    name: Old release · ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build the old release (v5.3.0 if tagged, else v5.2.0)
        run: |
          if git rev-parse -q --verify refs/tags/v5.3.0 >/dev/null; then
            tag=v5.3.0
          else
            tag=v5.2.0
          fi
          echo "old release: $tag"
          git worktree add "$RUNNER_TEMP/old-velo" "$tag"
          cargo build --release -p velo-cli --manifest-path "$RUNNER_TEMP/old-velo/Cargo.toml" --target-dir "$RUNNER_TEMP/old-target"

      - name: Build the current release binary
        run: cargo build --release -p velo-cli --locked

      - name: Old release refuses v4, and the bundle way back works
        run: python3 tests/corpus/old_release_check.py --old "$RUNNER_TEMP/old-target/release/velo" --new target/release/velo
