name: containers

# Builds the three images and smoke-tests them. No registry login, no push.
on:
  pull_request:
    paths:
      - "containers/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/containers.yml"
  push:
    branches: [main]
    paths:
      - "containers/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/containers.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test the images
        run: containers/smoke.sh
