name: setup-velo

on:
  pull_request:
    paths: ["setup-velo/**", ".github/workflows/setup-velo.yml"]
  # Branches only: a tag push races the release workflow and found no asset.
  # release.yml calls this after `publish`, which runs the `latest` check.
  push:
    branches: ["**"]
    paths: ["setup-velo/**", ".github/workflows/setup-velo.yml"]

  workflow_call:

permissions:
  contents: read

jobs:
  pinned:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - id: velo
        uses: ./setup-velo
        with:
          version: 6.1.0
      - name: Check the installed version and run velo init
        shell: bash
        env:
          REPORTED: ${{ steps.velo.outputs.version }}
        run: |
          velo --version | grep -F 6.1.0
          test "${REPORTED}" = "6.1.0"
          d=$(mktemp -d)
          cd "$d"
          velo init
  latest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./setup-velo
        with:
          version: latest
      - name: Run velo init
        shell: bash
        run: |
          velo --version
          d=$(mktemp -d)
          cd "$d"
          velo init
