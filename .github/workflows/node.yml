name: Node binding

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  node:
    name: Node · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: bindings/node
        run: npm install

      - name: Build
        working-directory: bindings/node
        run: npm run build

      - name: Test
        working-directory: bindings/node
        run: npm test

      - name: Clippy
        run: cargo clippy --manifest-path bindings/node/Cargo.toml -- -D warnings

      - name: Format
        run: cargo fmt --manifest-path bindings/node/Cargo.toml -- --check
