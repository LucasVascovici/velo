name: Demo transcript

# docs/demo/transcript.md is generated by docs/demo/demo.sh from the real
# binary. This job regenerates it and fails when the committed copy is stale.

on:
  push:
    branches: ["**"]
    paths:
      - "crates/**"
      - "docs/demo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/demo.yml"
  pull_request:
    paths:
      - "crates/**"
      - "docs/demo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  transcript:
    name: Transcript is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build velody
        run: cargo build --release --locked -p velody-cli

      - name: Regenerate the transcript
        run: bash docs/demo/demo.sh target/release/velody

      - name: Fail if the committed transcript is stale
        run: |
          if ! git diff --exit-code docs/demo/; then
            echo "docs/demo/transcript.md is stale. Run docs/demo/demo.sh and commit it." >&2
            exit 1
          fi
