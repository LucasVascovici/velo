name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Verify that Cargo.toml version matches the pushed tag ──────────────────
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cargo.toml version matches tag
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Cargo.toml ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✔ Version $CARGO_VERSION matches tag"

  # ── Create the release as a draft, once ────────────────────────────────────
  # Every job below attaches to this draft. It stays invisible to users (and
  # fires no `release` event) until the final `publish` job flips it, so nobody
  # ever sees a release with some of its assets missing.
  draft:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A rerun finds the draft from the first attempt: keep it.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # ── Build and publish binaries for every supported platform ───────────────
  build:
    name: Build · ${{ matrix.target }}
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86-64 (static musl binary) ─────────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: velo
            package: velo-x86_64-linux.tar.gz
            mcp_artifact: velo-mcp
            mcp_package: velo-mcp-x86_64-linux.tar.gz
            musl_cc: musl-gcc
            apt_packages: musl-tools

          # ── Linux ARM64 (static musl binary) ──────────────────────────────
          # Uses the native ARM64 runner — no cross-compilation needed, no
          # Docker, no separate toolchain.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: velo
            package: velo-aarch64-linux.tar.gz
            mcp_artifact: velo-mcp
            mcp_package: velo-mcp-aarch64-linux.tar.gz
            musl_cc: musl-gcc
            apt_packages: musl-tools

          # ── macOS Apple Silicon (native runner) ───────────────────────────
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: velo
            package: velo-aarch64-macos.tar.gz
            mcp_artifact: velo-mcp
            mcp_package: velo-mcp-aarch64-macos.tar.gz

          # ── macOS Intel (cross-compiled from the Apple Silicon runner) ────
          # Apple's own Clang ships both targets; no extra toolchain needed.
          # macos-13 was retired in 2026 — cross-compile instead.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: velo
            package: velo-x86_64-macos.tar.gz
            mcp_artifact: velo-mcp
            mcp_package: velo-mcp-x86_64-macos.tar.gz

          # ── Windows x86-64 ────────────────────────────────────────────────
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: velo.exe
            package: velo-x86_64-windows.zip
            mcp_artifact: velo-mcp.exe
            mcp_package: velo-mcp-x86_64-windows.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install Linux system packages
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.apt_packages }}

      # Set the C compiler for musl targets via $GITHUB_ENV so it is available
      # to all subsequent steps.  This is necessary because rusqlite's bundled
      # SQLite is compiled by cc-rs, which reads the CC environment variable.
      # The broken dynamic-key trick (${{ matrix.cc_env }}: '') does NOT work
      # in GitHub Actions — env map keys cannot be expressions.
      - name: Set CC for musl targets (Linux)
        if: matrix.musl_cc != ''
        run: echo "CC=${{ matrix.musl_cc }}" >> $GITHUB_ENV

      # Tests are run in debug mode (fast compile) before producing the release
      # binary.  --locked ensures exact dep versions from Cargo.lock.
      #
      # `--workspace` is not optional, for the same reason it is not optional in
      # ci.yml: `default-members` is velo-cli, so a bare `cargo test` runs 19
      # integration tests and silently skips ~390 others. Without it this job
      # reported success on a commit whose suite was failing.
      - name: Run tests
        run: cargo test --workspace --locked

      # Reproducibility settings, identical to reproducible.yml. Set after the
      # tests so the debug test build is unaffected. Any RUSTFLAGS already
      # present is kept and the remaps are appended.
      - name: Set reproducible build environment
        shell: bash
        run: |
          {
            echo "CARGO_INCREMENTAL=0"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=${{ github.workspace }}=/build --remap-path-prefix=$HOME/.cargo=/cargo"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p velo-cli -p velo-mcp

      # ── Package ────────────────────────────────────────────────────────────
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          test -f "$BINARY" || (echo "Binary not found at $BINARY" && exit 1)
          tar -czf "${{ matrix.package }}" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.artifact }}"
          MCP="target/${{ matrix.target }}/release/${{ matrix.mcp_artifact }}"
          test -f "$MCP" || (echo "Binary not found at $MCP" && exit 1)
          tar -czf "${{ matrix.mcp_package }}"             -C "target/${{ matrix.target }}/release" "${{ matrix.mcp_artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          if (-not (Test-Path $binary)) { throw "Binary not found: $binary" }
          Compress-Archive -Path $binary -DestinationPath "${{ matrix.package }}"
          $mcp = "target/${{ matrix.target }}/release/${{ matrix.mcp_artifact }}"
          if (-not (Test-Path $mcp)) { throw "Binary not found: $mcp" }
          Compress-Archive -Path $mcp -DestinationPath "${{ matrix.mcp_package }}"

      # Build provenance: ties each archive to this workflow run and commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ matrix.package }}
            ${{ matrix.mcp_package }}

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "${{ matrix.package }}" "${{ matrix.mcp_package }}"

      # The checksums job reads these, not the draft release: `gh release
      # download` is not relied on to find a draft.
      - name: Keep the archives for the checksums job
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            ${{ matrix.package }}
            ${{ matrix.mcp_package }}
          if-no-files-found: error

  # ── Software bill of materials (CycloneDX JSON) for velo-cli ──────────────
  sbom:
    name: SBOM
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cargo cyclonedx --manifest-path crates/velo-cli/Cargo.toml --format json
          SRC=$(ls crates/velo-cli/*.cdx.json | head -1)
          mv "$SRC" "velo-${VERSION}.cdx.json"
          echo "SBOM_FILE=velo-${VERSION}.cdx.json" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.SBOM_FILE }}

      - name: Attach SBOM to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$SBOM_FILE"

      - name: Keep the SBOM for the checksums job
        uses: actions/upload-artifact@v4
        with:
          name: cli-sbom
          path: ${{ env.SBOM_FILE }}
          if-no-files-found: error

  # -- Wheels and Node tarballs: built and install-tested by packages.yml ----
  bindings:
    name: Bindings
    needs: draft
    uses: ./.github/workflows/packages.yml

  # -- Attach the bindings, with checksums, to the release -------------------
  # Needs the whole reusable workflow, so the install tests gate the attach.
  # Nothing is published to a registry.
  attach-bindings:
    name: Attach bindings
    needs: [draft, bindings]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: bindings-dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: bindings-dist
          merge-multiple: true
      - name: Write checksums
        shell: bash
        working-directory: bindings-dist
        run: |
          ls -l
          test "$(ls *.whl | wc -l)" -eq 3
          test "$(ls *.tgz | wc -l)" -eq 3
          sha256sum *.whl *.tgz > SHA256SUMS-bindings.txt
          cat SHA256SUMS-bindings.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            bindings-dist/*.whl
            bindings-dist/*.tgz

      # Keyless signing with the workflow's GitHub OIDC identity; no keys or
      # secrets are stored anywhere.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
      - name: Sign the bindings checksums
        shell: bash
        working-directory: bindings-dist
        run: cosign sign-blob --yes --bundle SHA256SUMS-bindings.txt.sigstore.json SHA256SUMS-bindings.txt

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            bindings-dist/*.whl bindings-dist/*.tgz \
            bindings-dist/SHA256SUMS-bindings.txt \
            bindings-dist/SHA256SUMS-bindings.txt.sigstore.json

  # -- Checksums over the CLI and MCP archives and the SBOM, signed ----------
  checksums:
    name: Checksums
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download the CLI assets
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: cli-dist
          merge-multiple: true
      - name: Write checksums
        shell: bash
        working-directory: cli-dist
        run: |
          ls -l
          # 5 CLI archives, 5 MCP archives and the SBOM.
          # The globs match the download patterns, so the Node tarballs
          # (velo-core-*.tgz) attached in parallel never enter the file.
          files=$(ls velo-*.tar.gz velo-*.zip velo-*.cdx.json)
          test "$(echo "$files" | wc -l)" -eq 11
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
      - name: Sign the checksums
        shell: bash
        working-directory: cli-dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            cli-dist/SHA256SUMS.txt cli-dist/SHA256SUMS.txt.sigstore.json

  # -- Make the release public: the only place draft turns false -------------
  # Add every job that attaches or checks something to this `needs:` list.
  publish:
    name: Publish release
    needs: [build, sbom, attach-bindings, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # -- Jobs that consume the published release --------------------------------
  # A release made with GITHUB_TOKEN triggers no other workflow, so the
  # `release: published` trigger never fires; call them from here instead.
  distribution:
    name: Distribution manifests
    needs: publish
    uses: ./.github/workflows/distribution.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

  setup-velo:
    name: setup-velo
    needs: publish
    uses: ./.github/workflows/setup-velo.yml
    permissions:
      contents: read

  release-verify:
    name: Release verify
    needs: publish
    uses: ./.github/workflows/release-verify.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
      attestations: read
