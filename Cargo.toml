[workspace]
resolver = "2"
members = [
    "crates/velo-merge",
    "crates/velo-core",
    "crates/velo-tui",
    "crates/velo-cli",
    "crates/velo-testkit",
    "examples/prompt-registry",
]

# `cargo build` / `cargo run` at the workspace root builds the CLI.
default-members = ["crates/velo-cli"]

[workspace.package]
version = "4.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LucasVascovici/velo"
homepage = "https://github.com/LucasVascovici/velo"
# Derived rather than guessed: the highest MSRV among the dependency tree, which
# `ignore` sets. CI builds the workspace on exactly this toolchain, so the number
# is checked on every push instead of being a claim in a manifest.
rust-version = "1.88"

# Single source of truth for dependency versions across the workspace.
[workspace.dependencies]
velo-core = { path = "crates/velo-core", version = "4.0.0" }
velo-merge = { path = "crates/velo-merge", version = "4.0.0" }
velo-tui = { path = "crates/velo-tui", version = "4.0.0" }
velo-testkit = { path = "crates/velo-testkit", version = "4.0.0" }

blake3 = { version = "1.8", features = ["rayon"] }
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
console = "0.16"
fs2 = "0.4"
ignore = "0.4"
memmap2 = "0.9"
parking_lot = "0.12"
proptest = "1"
rayon = "1.11"
regex = "1.12"
rusqlite = { version = "0.39", features = ["bundled"] }
similar = "3.1.1"
tempfile = "3.27"
zstd = "0.13"
