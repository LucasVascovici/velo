[workspace]
resolver = "2"
# cargo-fuzz needs nightly and its own lockfile; it is built only by fuzz.yml.
exclude = ["fuzz"]
members = [
    "crates/velody-merge",
    "crates/velody-core",
    "crates/velody-tui",
    "crates/velody-cli",
    "crates/velody-testkit",
    "crates/velody-ffi",
    "crates/velody-mcp",
    "examples/prompt-registry",
]

# `cargo build` / `cargo run` at the workspace root builds the CLI.
default-members = ["crates/velody-cli"]

[workspace.package]
version = "7.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LucasVascovici/velody"
homepage = "https://github.com/LucasVascovici/velody"
# Derived rather than guessed: the highest MSRV among the dependency tree, which
# `ignore` sets. CI builds the workspace on exactly this toolchain, so the number
# is checked on every push instead of being a claim in a manifest.
rust-version = "1.88"

# Single source of truth for dependency versions across the workspace.
[workspace.dependencies]
velody-core = { path = "crates/velody-core", version = "7.0.0" }
velody-merge = { path = "crates/velody-merge", version = "7.0.0" }
velody-tui = { path = "crates/velody-tui", version = "7.0.0" }
velody-testkit = { path = "crates/velody-testkit", version = "7.0.0" }

blake3 = { version = "1.8", features = ["rayon"] }
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
console = "0.16"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
fs2 = "0.4"
getrandom = "0.4"
fastcdc = "3"
globset = "0.4"
ignore = "0.4"
memmap2 = "0.9"
parking_lot = "0.12"
proptest = "1"
rayon = "1.11"
regex = "1.12"
rusqlite = { version = "0.39", features = ["bundled"] }
similar = "3.1.1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
tempfile = "3.27"
base64 = "0.23"
tiny_http = "0.12"
toml = { version = "0.9", features = ["preserve_order"] }
ureq = "3"
zstd = "0.14"
