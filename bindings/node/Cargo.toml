[package]
name = "velo-node"
version = "0.1.0"
edition = "2021"
publish = false
description = "Node.js binding for velo-core"

# An empty table makes this its own workspace root, so napi-rs and the Node
# toolchain stay out of the main `cargo test --workspace`.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
velo-core = { path = "../../crates/velo-core" }
napi = { version = "3", default-features = false, features = ["napi6", "async"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
