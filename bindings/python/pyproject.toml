[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "velo"
version = "0.1.0"
description = "Python binding for the velo timeline engine"
requires-python = ">=3.9"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "velo._velo"
python-source = "python"
