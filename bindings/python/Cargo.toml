[package]
name = "velody-py"
version = "7.0.0"
edition = "2021"
publish = false
description = "Python binding for velody-core"

# An empty table makes this its own workspace root, so PyO3's Python toolchain
# stays out of the main `cargo test --workspace`.
[workspace]

[lib]
name = "_velody"
crate-type = ["cdylib"]

[dependencies]
velody-core = { path = "../../crates/velody-core", features = ["json", "yaml", "toml"] }
pyo3 = { version = "0.29", features = ["abi3-py39", "multiple-pymethods"] }
