name: Setup velo
description: Install a velo release and put it on PATH, with no package manager.
branding:
  icon: download
  color: blue
inputs:
  version:
    description: "Release to install: latest, 6.1.0 or v6.1.0."
    default: latest
  token:
    description: Token for the GitHub API, to avoid rate limits.
    default: ${{ github.token }}
outputs:
  version:
    description: The version reported by velo --version.
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        VELO_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: LucasVascovici/velo
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) asset=velo-x86_64-linux.tar.gz ;;
          Linux-ARM64) asset=velo-aarch64-linux.tar.gz ;;
          macOS-ARM64) asset=velo-aarch64-macos.tar.gz ;;
          macOS-X64) asset=velo-x86_64-macos.tar.gz ;;
          Windows-X64) asset=velo-x86_64-windows.zip ;;
          *) echo "::error::setup-velo does not support ${RUNNER_OS} ${RUNNER_ARCH}"; exit 1 ;;
        esac
        auth=()
        if [ -n "${GH_TOKEN:-}" ]; then auth=(-H "Authorization: Bearer ${GH_TOKEN}"); fi
        if [ "${VELO_VERSION}" = "latest" ]; then
          tag=$(curl -fsSL ${auth[@]+"${auth[@]}"} "https://api.github.com/repos/${REPO}/releases/latest" \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1)
          if [ -z "${tag}" ]; then echo "::error::could not resolve the latest velo release"; exit 1; fi
        else
          tag="v${VELO_VERSION#v}"
        fi
        base="https://github.com/${REPO}/releases/download/${tag}"
        dest="${RUNNER_TOOL_CACHE}/velo/${tag#v}/${RUNNER_ARCH}"
        tmp=$(mktemp -d)
        mkdir -p "${dest}"
        echo "Downloading ${asset} from ${tag}"
        curl -fsSL --retry 3 -o "${tmp}/${asset}" "${base}/${asset}"
        if curl -fsSL --retry 3 -o "${tmp}/SHA256SUMS.txt" "${base}/SHA256SUMS.txt" 2>/dev/null; then
          expected=$(grep -F "${asset}" "${tmp}/SHA256SUMS.txt" | awk '{print $1}' | head -n1)
          if [ -z "${expected}" ]; then
            echo "::error::SHA256SUMS.txt has no entry for ${asset}"; exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "${tmp}/${asset}" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "${tmp}/${asset}" | awk '{print $1}')
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::checksum mismatch for ${asset}: expected ${expected}, got ${actual}"; exit 1
          fi
          echo "Checksum verified"
        else
          echo "::notice::${tag} has no SHA256SUMS.txt; skipping checksum verification"
        fi
        case "${asset}" in
          *.zip) unzip -q -o "${tmp}/${asset}" -d "${dest}" ;;
          *) tar -xzf "${tmp}/${asset}" -C "${dest}" ;;
        esac
        # Archives may nest the binary in a directory; put whichever holds it on PATH.
        exe=velo; if [ "${RUNNER_OS}" = "Windows" ]; then exe=velo.exe; fi
        found=$(find "${dest}" -name "${exe}" -type f | head -n1)
        if [ -z "${found}" ]; then echo "::error::${exe} not found in ${asset}"; exit 1; fi
        bindir=$(dirname "${found}")
        chmod +x "${found}"
        if [ "${RUNNER_OS}" = "Windows" ]; then bindir=$(cygpath -w "${bindir}"); fi
        echo "${bindir}" >> "${GITHUB_PATH}"
        reported=$("${found}" --version)
        echo "version=${reported#velo }" >> "${GITHUB_OUTPUT}"
        echo "Installed ${reported}"
